name: Rust

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Install nightly toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo +nightly fmt --all -- --check
    - name: Run tests without features
      run: cargo +stable test -- -q
    - name: Run tests with features enabled
      run: cargo +stable test --features=proposals,serde -- -q
    - name: Run tests with only wide arithmetic enabled
      run: cargo +stable test --no-default-features --features=wide-arithmetic -- -q
  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - toolchain: stable
          args: --no-default-features
        - toolchain: stable
          args: --features=proposals,serde
        - toolchain: stable
          args: --no-default-features --features=wide-arithmetic
        - toolchain: stable
          args: --no-default-features --features=threads
        - toolchain: stable
          args: --no-default-features --features=custom-page-sizes
        - toolchain: nightly
          args: --all-features

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
        components: clippy
    - name: Check all targets with strict Clippy lints
      run: cargo clippy --workspace --all-targets ${{ matrix.args }} -- -D warnings

  clippy-fuzz:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Check fuzz targets with strict Clippy lints
      run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
