
[package]
name = "wasmbin-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

# This package has its own workspace, so it cannot inherit the root lint configuration.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
as_conversions = "warn"
elidable_lifetime_names = "warn"
partial_pub_fields = "warn"
uninlined_format_args = "warn"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.2"
wasm-smith = "0.244.0"

[dependencies.wasmbin]
path = ".."
features = ["proposals"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
